name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-stable-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features

  test-packaged:
    name: Test packaged crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-packaged
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Package ekf2-sys
        run: cargo package -p ekf2-sys --no-verify --locked

      - name: Verify packaged workspace and compare ekf2-sys to git source
        run: |
          set -euo pipefail
          BUILD=$(mktemp -d)
          PKG_SYS="$BUILD/ekf2-sys-package"
          GIT_SYS="$BUILD/ekf2-sys-git"
          PKG_WORKSPACE="$BUILD/packaged-workspace"
          PKG_SYS_TARGET="$BUILD/target-pkg-sys"
          GIT_SYS_TARGET="$BUILD/target-git-sys"
          PKG_WS_TARGET="$BUILD/target-pkg-workspace"

          tar xf target/package/ekf2-sys-*.crate -C "$BUILD"
          PKG_SYS=$(ls -d "$BUILD"/ekf2-sys-*)

          cpp_symbols() {
            local target_dir="$1"
            local a
            a=$(find "$target_dir" -path '*/out/libekf2_cpp.a' -print -quit)
            [ -n "$a" ] || { echo "FAIL: libekf2_cpp.a not found under $target_dir"; exit 1; }
            nm "$a" | sort | sha256sum | awk '{print $1}'
          }

          copy_packaged_files() {
            local pkg="$1"
            local src_root="$2"
            local dest_root="$3"
            mkdir -p "$dest_root"

            cargo package -p "$pkg" --list --locked | while IFS= read -r rel; do
              case "$rel" in
                ''|.cargo_vcs_info.json|Cargo.toml.orig)
                  continue
                  ;;
              esac

              local from="$src_root/$rel"
              if [ ! -e "$from" ]; then
                from="$PWD/$rel"
              fi

              [ -e "$from" ] || { echo "FAIL: missing packaged file for $pkg: $rel"; exit 1; }
              mkdir -p "$dest_root/$(dirname "$rel")"
              cp "$from" "$dest_root/$rel"
            done
          }

          # Build A: the actual packaged ekf2-sys tarball, with every feature enabled.
          # This catches missing fixtures, omitted vendor files, and feature-gated sources.
          cargo test --manifest-path "$PKG_SYS/Cargo.toml" --all-features --target-dir "$PKG_SYS_TARGET"
          SYM_PKG=$(cpp_symbols "$PKG_SYS_TARGET")

          # Build B: the git source tree using the packaged manifest and lockfile so the
          # dependency set matches the packaged build.
          cp -R ekf2-sys "$GIT_SYS"
          cp "$PKG_SYS/Cargo.toml" "$GIT_SYS/Cargo.toml"
          cp "$PKG_SYS/Cargo.lock" "$GIT_SYS/Cargo.lock"
          cargo build --manifest-path "$GIT_SYS/Cargo.toml" --lib --all-features --target-dir "$GIT_SYS_TARGET"
          SYM_GIT=$(cpp_symbols "$GIT_SYS_TARGET")

          # ekf2 cannot be turned into a real .crate tarball until ekf2-sys exists in the
          # registry, so stage a temporary workspace from the exact file sets that
          # `cargo package --list` would ship and test that staged package tree instead.
          mkdir -p "$PKG_WORKSPACE"
          cat > "$PKG_WORKSPACE/Cargo.toml" <<'EOF'
          [workspace]
          members = ["ekf2-sys", "ekf2"]
          resolver = "2"

          [workspace.package]
          authors = ["Louis Schell"]
          edition = "2021"
          license = "BSD-3-Clause"
          repository = "https://github.com/rechenmaschine/ekf2-rs"
          version = "0.1.0"
          EOF

          cp README.md "$PKG_WORKSPACE/README.md"
          copy_packaged_files ekf2-sys ekf2-sys "$PKG_WORKSPACE/ekf2-sys"
          copy_packaged_files ekf2 ekf2 "$PKG_WORKSPACE/ekf2"
          cargo test --manifest-path "$PKG_WORKSPACE/Cargo.toml" --workspace --all-features --target-dir "$PKG_WS_TARGET"

          echo "Package symbols: $SYM_PKG"
          echo "Git symbols:     $SYM_GIT"
          [ "$SYM_PKG" = "$SYM_GIT" ] \
            && echo "PASS: ekf2-sys packaged and git C++ symbol tables match" \
            || { echo "FAIL: symbol tables differ — packaged ekf2-sys is missing or has wrong C++ sources"; exit 1; }

  build-targets:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
          - x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Install ARM cross compiler
        if: startsWith(matrix.target, 'thumb')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-stable-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build workspace libraries for target
        run: cargo build --workspace --lib --target ${{ matrix.target }}
